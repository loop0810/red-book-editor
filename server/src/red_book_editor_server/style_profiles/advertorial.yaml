form: advertorial
display_name: 软文
hooks:
  - "真实困扰开头（记录宝宝成长阶段遇到的小问题）"
  - "真实变化（记录实际尝试和宝宝的实际反应）"
structures:
  - name: 故事种草
    sequence: [问题引入, 过程细节, 产品/方案出现, 用户实际体验, 互动收尾]
  - name: 对比安利
    sequence: [问题引入, 尝试对比, 选择依据, 用户实际体验, 互动收尾]
tone:
  person: 第一人称分享者
  words: [没想到, 真的牛, 分担, 压力, 省心]
  forbidden: [绝对, 第一, 唯一]
rich_text:
  emoji_rules: "每段不超过 2 个 emoji"
  separators: ["|", "•"]
  tag_count_range: [5, 10]
tags:
  generic: [宝妈分享, 生活记录, 经验分享]
  precise: [育儿好物, 居家育儿, 宝宝成长记录]
  trending: [爬行期宝宝, 育儿经验, 宝宝成长, 家庭陪伴]
cover:
  pattern: "大字短句：痛点+结果"
  examples: ["宝宝成长阶段的真实记录", "育儿小困扰的实际尝试"]
cta: [有同样经历的宝妈可以聊聊, 分享你的实际体验]
