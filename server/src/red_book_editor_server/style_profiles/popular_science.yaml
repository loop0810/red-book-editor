form: popular_science
display_name: 科普
hooks:
  - "问题拆解 + 边界提醒（先说明来源范围，再讲观察）"
  - "数字 + 场景（只使用来源中已经提供的数字）"
  - "提醒式（明确哪些情况需要进一步确认）"
structures:
  - name: 科普清单
    sequence: [钩子标题, 问题引入, 信息清单, 来源范围, 红线/误区, CTA收尾]
  - name: 权威拆解
    sequence: [来源说明, 核心问题, 分点解读, 需要确认的边界, 误区提醒]
rewrite_rules:
  - "先用问题或边界做新的开头，再整理来源信息，不要照抄用户原句。"
  - "只能解释已提供的信息，不能补充医生、研究、结果或普遍适用结论。"
tone:
  person: 第一人称妈妈视角 + 权威转述
  words: [新手爸妈, 抄作业, 亲测, 记住, 红线, 收藏]
  forbidden: [百分之百, 保证治好, 根治]
rich_text:
  emoji_rules: "每段不超过 2 个 emoji，标题不超过 1 个"
  separators: ["•", "|", "1", "2", "3"]
  tag_count_range: [6, 15]
tags:
  generic: [育儿干货, 亲子育儿, 母婴知识, 科学育儿, 新手爸妈必看]
  precise: [宝宝护理, 新手爸妈经验, 育儿经验分享, 宝宝成长记录]
  trending: [科学育儿, 育儿日常, 亲子陪伴, 成长记录]
cover:
  pattern: "大字短句：数字+事件 或 权威背书+结果"
  examples: ["宝宝成长阶段的一个问题", "把来源中的信息整理清楚"]
cta: [新手爸妈可以按需参考, 先确认来源和适用边界, 建议收藏后按需查看]
