form: popular_science
display_name: 科普
hooks:
  - "权威背书 + 结果（崔玉涛说的没错，果然30分钟退烧）"
  - "数字 + 反差（13个月宝宝发烧 40.3度）"
  - "警示式（7月的病毒来势汹汹）"
structures:
  - name: 科普清单
    sequence: [钩子标题, 问题引入, 分级清单, 实操要点, 红线/误区, CTA收尾]
  - name: 权威拆解
    sequence: [权威观点背书, 核心原则, 分点解读, 就医红线, 误区提醒]
tone:
  person: 第一人称妈妈视角 + 权威转述
  words: [新手爸妈, 抄作业, 亲测, 记住, 红线, 收藏]
  forbidden: [百分之百, 保证治好, 根治]
rich_text:
  emoji_rules: "每段不超过 2 个 emoji，标题不超过 1 个"
  separators: ["•", "|", "1", "2", "3"]
  tag_count_range: [6, 15]
tags:
  generic: [育儿干货, 亲子育儿, 母婴知识, 科学育儿, 新手爸妈必看]
  precise: [宝宝护理, 新手宝妈经验, 育儿经验分享, 宝宝成长记录]
  trending: [崔玉涛育儿, 崔玉涛, 宝宝发烧, 发烧护理, 新生儿护理]
cover:
  pattern: "大字短句：数字+事件 或 权威背书+结果"
  examples: ["13个月宝宝发烧 40.3度", "崔玉涛说的没错！！果然半小时就退烧了"]
cta: [新手爸妈直接抄作业, 收藏这份攻略，关键时刻能救命, 建议收藏慢慢看]
