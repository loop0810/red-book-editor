form: experience
display_name: 经验
hooks:
  - "事件 + 阶段（记录宝宝成长中的一次真实经历）"
  - "情绪记录（写下当时真实感受）"
  - "时间线复盘（按时间记录过程和观察）"
structures:
  - name: 时间线复盘
    sequence: [钩子标题, 背景铺垫, 时间线记录, 经验要点, 碎碎念/祝愿]
  - name: 经历叙述
    sequence: [事件开头, 过程细节, 情绪起伏, 结果, 给同路人的话]
rewrite_rules:
  - "原始素材只是事实便签，必须重新组织，不得直接复制第一段。"
  - "优先使用真实过程、观察和取舍组织故事；没有提供的情绪和结果不要补写。"
tone:
  person: 第一人称真实经历
  words: [当时, 真的, 吓, 终于, 后来, 慢慢, 别慌]
  forbidden: []
rich_text:
  emoji_rules: "正文可用 2-4 个情绪 emoji，避免过度"
  separators: ["|", "·", "1", "2"]
  tag_count_range: [4, 12]
tags:
  generic: [育儿日常, 宝妈分享, 亲子日常, 成长记录]
  precise: [宝宝成长记录, 新手爸妈, 育儿经验, 周岁记录]
  trending: [育儿日常, 成长记录, 亲子陪伴, 宝宝成长]
cover:
  pattern: "大字短句：事件+情绪 或 数字+事件"
  examples: ["宝宝成长中的一次真实经历", "记录宝宝某个阶段的小变化"]
cta: [希望所有宝宝都健健康康, 有类似经历的宝妈可以一起聊聊]
